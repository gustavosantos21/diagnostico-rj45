name: Compilar e verificar
on:
  push:
    branches: [main, 'feature/**', 'fix/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        shell: powershell
        run: .\compilar.ps1
      - name: Verificar interpretações sem hardware
        shell: powershell
        run: |
          $p = Start-Process .\DiagnosticoRJ45.exe -ArgumentList '--unit-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Falha nas verificações: $($p.ExitCode)" }
      - name: Verificar execução portátil sem arquivos auxiliares
        shell: powershell
        run: |
          $portable = Join-Path $env:RUNNER_TEMP 'RJ45-Portable'
          New-Item -ItemType Directory -Path $portable -Force | Out-Null
          Copy-Item .\DiagnosticoRJ45.exe $portable
          foreach ($mode in @('--unit-test', '--self-test')) {
            $p = New-Object System.Diagnostics.Process
            $p.StartInfo.FileName = Join-Path $portable 'DiagnosticoRJ45.exe'
            $p.StartInfo.Arguments = $mode
            $p.StartInfo.WorkingDirectory = $portable
            $p.StartInfo.UseShellExecute = $false
            $p.StartInfo.RedirectStandardOutput = $true
            $p.StartInfo.RedirectStandardError = $true
            $p.Start() | Out-Null
            $output = $p.StandardOutput.ReadToEndAsync()
            $errorOutput = $p.StandardError.ReadToEndAsync()
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "Tempo excedido no modo $mode" }
            if ($p.ExitCode -ne 0) { throw "Falha no modo ${mode}: $($errorOutput.Result)" }
            $p.Dispose()
          }
          $files = @(Get-ChildItem -LiteralPath $portable -Force -Recurse)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'DiagnosticoRJ45.exe') { throw 'Foram criados arquivos auxiliares na pasta portátil' }
      - name: Verificar script PowerShell (sintaxe, interpretação e loopback)
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\DiagnosticoRJ45.ps1), [ref]$tokens, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error "$($_.Extent.StartLineNumber): $($_.Message)" }; throw 'Erro de sintaxe no script' }
          $portable = Join-Path $env:RUNNER_TEMP 'RJ45-Script'
          New-Item -ItemType Directory -Path $portable -Force | Out-Null
          Copy-Item .\DiagnosticoRJ45.ps1 $portable
          Push-Location $portable
          foreach ($mode in @('-UnitTest', '-SelfTest')) {
            powershell -NoProfile -ExecutionPolicy RemoteSigned -File .\DiagnosticoRJ45.ps1 $mode
            if ($LASTEXITCODE -ne 0) { throw "Falha no modo $mode" }
          }
          Pop-Location
          $files = @(Get-ChildItem -LiteralPath $portable -Force -Recurse)
          if ($files.Count -ne 1) { throw 'Foram criados arquivos auxiliares na pasta do script' }
      - uses: actions/upload-artifact@v4
        with:
          name: DiagnosticoRJ45-Portatil
          path: |
            DiagnosticoRJ45.exe
            DiagnosticoRJ45.ps1
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DiagnosticoRJ45-Portatil
          path: dist
      - name: Publicar versão
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$env:RELEASE_TAG" .\dist\DiagnosticoRJ45.exe .\dist\DiagnosticoRJ45.ps1 --verify-tag --title "Diagnóstico RJ45 $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar a release' }
